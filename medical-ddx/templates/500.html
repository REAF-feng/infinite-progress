{% extends "base.html" %} {% block title %}Server Error - Medical Diagnosis Assistant{% endblock %} {% block content %}
<div class="container my-5">
	<div class="row justify-content-center">
		<div class="col-lg-6 text-center">
			<div class="mb-4">
				<i class="fas fa-exclamation-triangle fa-6x text-warning mb-4"></i>
				<h1 class="display-1 fw-bold text-danger">500</h1>
				<h2 class="mb-3">Internal Server Error</h2>
				<p class="lead text-muted mb-4">Something went wrong on our end. We're working to fix the issue.</p>

				<div class="d-grid gap-2 d-md-block">
					<a
						href="{{ url_for('index') }}"
						class="btn btn-primary btn-lg"
					>
						<i class="fas fa-home me-2"></i>
						Go to Home
					</a>
					<button
						onclick="location.reload()"
						class="btn btn-outline-primary btn-lg"
					>
						<i class="fas fa-redo me-2"></i>
						Try Again
					</button>
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}
