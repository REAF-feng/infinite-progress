{% extends "base.html" %}
{% block title %}C语言学习{% endblock %}
{% block content %}

<div class="grid-2">
  <!-- 知识点列表 -->
  <div>
    <div class="card">
      <div class="card-header">
        <span class="icon">🇨</span> C语言知识点清单（60天）
        <span style="margin-left:auto;font-size:13px;color:var(--text2);" id="knowledge-count"></span>
      </div>

      <!-- 阶段筛选 -->
      <div class="filter-tabs" id="c-stage-filters">
        <button class="filter-tab active" data-stage="all">全部</button>
        <button class="filter-tab" data-stage="入门基础">入门基础</button>
        <button class="filter-tab" data-stage="数组与字符串">数组与字符串</button>
        <button class="filter-tab" data-stage="函数">函数</button>
        <button class="filter-tab" data-stage="指针">指针</button>
        <button class="filter-tab" data-stage="结构体与联合">结构体与联合</button>
        <button class="filter-tab" data-stage="动态内存">动态内存</button>
        <button class="filter-tab" data-stage="文件操作">文件操作</button>
        <button class="filter-tab" data-stage="进阶技巧">进阶技巧</button>
        <button class="filter-tab" data-stage="算法入门">算法入门</button>
        <button class="filter-tab" data-stage="数据结构">数据结构</button>
        <button class="filter-tab" data-stage="项目实战">项目实战</button>
      </div>

      <div id="c-knowledge-list" style="max-height:600px;overflow-y:auto;">
        <div class="text-center text-muted" style="padding:20px;">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 右侧面板 -->
  <div>
    <!-- 打卡区域 -->
    <div class="card text-center">
      <div class="card-header"><span class="icon">📝</span> 今日C语言打卡</div>
      <div id="c-checkin-status" style="margin-bottom:16px;">
        <span class="text-muted">加载中...</span>
      </div>
      <button class="btn btn-primary btn-lg" onclick="showCheckinModal('c_lang', 'C语言', () => location.reload())">
        📝 C语言打卡
      </button>
      <div id="c-streak-info" class="text-sm text-muted mt-4"></div>
    </div>

    <!-- 学习进度 -->
    <div class="card">
      <div class="card-header"><span class="icon">📊</span> 学习进度</div>
      <div id="c-progress-container">
        <div class="text-sm text-muted mb-4" id="c-progress-text">加载中...</div>
        <div class="progress-bar">
          <div class="progress-fill accent" id="c-progress-bar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- 学习笔记 -->
    <div class="card">
      <div class="card-header"><span class="icon">🗒️</span> 最近打卡笔记</div>
      <div id="c-notes" style="max-height:200px;overflow-y:auto;">
        <div class="text-muted text-sm">暂无记录</div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
(async function() {
  try {
    // 加载知识点
    const knowledge = await api.get('/api/knowledge/c_lang');
    const checkinData = await api.get('/api/checkin/c_lang?days=60');
    const todayData = await api.get('/api/checkin/today');

    const checkedDates = new Set(checkinData.history.map(h => h.date));
    document.getElementById('c-streak-info').textContent = `🔥 连续打卡: ${checkinData.streak} 天`;

    const todayCheck = todayData.c_lang;
    const statusEl = document.getElementById('c-checkin-status');
    if (todayCheck) {
      statusEl.innerHTML = `<span style="color:var(--green);">✅ 今日已打卡 · ${todayCheck.study_time_min}分钟 · 自评${todayCheck.self_score}/10</span>`;
    } else {
      statusEl.innerHTML = '<span style="color:var(--text2);">⬜ 今日尚未打卡</span>';
    }

    // 渲染知识清单
    const listEl = document.getElementById('c-knowledge-list');
    let filteredKnowledge = knowledge;

    // 阶段筛选
    const filterTabs = document.querySelectorAll('#c-stage-filters .filter-tab');
    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const stage = tab.dataset.stage;
        renderKnowledge(stage === 'all' ? knowledge : knowledge.filter(k => k.stage === stage));
      });
    });

    function renderKnowledge(items) {
      document.getElementById('knowledge-count').textContent = `共${items.length}天`;
      const completedCount = items.filter(k => checkedDates.has(new Date().toISOString().slice(0,10))).length;
      const totalDays = items.length;

      listEl.innerHTML = items.map(k => `
        <div class="knowledge-item ${checkedDates.has(new Date().toISOString().slice(0,10)) ? 'checked' : ''}">
          <div class="day-num">${k.day}</div>
          <div class="day-info">
            <div class="day-topic">${k.topic}</div>
            <div class="day-points">${(k.points || []).join(' · ')}</div>
            <div class="day-stage"><span class="tag accent">${k.stage}</span></div>
          </div>
        </div>
      `).join('');

      // 更新进度条
      const pct = totalDays > 0 ? Math.round(completedCount / totalDays * 100) : 0;
      document.getElementById('c-progress-text').textContent = `已完成 ${completedCount} / ${totalDays} 天 (${pct}%)`;
      document.getElementById('c-progress-bar').style.width = pct + '%';
    }

    renderKnowledge(knowledge);

    // 最近笔记
    const notesEl = document.getElementById('c-notes');
    const notesList = checkinData.history.filter(h => h.notes).slice(0, 5);
    if (notesList.length > 0) {
      notesEl.innerHTML = notesList.map(h => `
        <div style="margin-bottom:8px;padding:8px;background:var(--surface2);border-radius:6px;">
          <div style="font-size:12px;color:var(--text3);">${h.date}</div>
          <div style="font-size:13px;">${h.notes}</div>
        </div>
      `).join('');
    }
  } catch(e) {
    console.error('Failed to load C knowledge:', e);
  }
})();
</script>
{% endblock %}
